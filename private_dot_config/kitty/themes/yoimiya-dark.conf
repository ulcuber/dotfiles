#  Kitty Elysia Dark Theme - Pastel Pink & Gold Moe
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Cursor ──
cursor            #d27c3b
cursor_text_color #f5ebf0

# ── Elysia Color Palette ──
foreground       #f5ebf0
background       #5a3d5c

# ── Normal Colors ──
color0           #f5ebf0      # Black
color1           #a01e1c      # Red
color2           #537054      # Green
color3           #db9c70      # Yellow
color4           #ac8b9d      # Blue
color5           #98777d      # Magenta
color6           #c67e50      # Cyan
color7           #000011      # White (Black)

# ── Bright Colors ──
color8           #f5ebf0      # Bright Black
color9           #c92e21      # Bright Red
color10          #9ec78e      # Bright Green
color11          #e5934a      # Bright Yellow
color12          #a4879d      # Bright Blue
color13          #7f626d      # Bright Magenta
color14          #b68c9e      # Bright Cyan
color15          #000000      # Bright White (Black)

# ── Selection Colors ──
selection_background #5a3d5c
selection_foreground #ffb8d0

# ── Marks ──
mark1_background #ff7b9c
mark1_foreground #ffffff
mark2_background #e8c97a
mark2_foreground #5a3d5c
mark3_background #ffb8d0
mark3_foreground #5a3d5c

# ── Window ──
background_tint 0.05

active_tab_foreground   #5a3d5c
active_tab_background   #ffb8d0
active_tab_font_style   bold-italic
inactive_tab_foreground #ffe8f0
inactive_tab_background #7a5d7c
inactive_tab_font_style normal

# ── Bell ──
visual_bell_color #7a5d7c

# ── URLs ──
url_color #e8c97a
url_style curly
